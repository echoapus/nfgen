[package]
name = "nfgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "NeoFlow Generator: a validated NetFlow v9 generator with offline preview"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
